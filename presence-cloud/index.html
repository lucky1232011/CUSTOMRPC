<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0e12"><title>Presence Cloud</title><link rel="stylesheet" href="styles.css"></head><body>
<aside class="sidebar"><div class="brand"><span class="brand-mark">✳</span><span>presence<span class="brand-light">cloud</span><small>PERSONAL ACTIVITY STUDIO</small></span></div><div class="nav-label">WORKSPACE</div><nav id="nav"><button class="nav-item selected" data-page="overview"><i>◫</i> Overview</button><button class="nav-item" data-page="profiles"><i>▤</i> RPC Profiles <b id="profile-count">0</b></button><button class="nav-item" data-page="rotator"><i>⟳</i> Rotator</button><button class="nav-item" data-page="scheduler"><i>◷</i> Scheduler</button><button class="nav-item" data-page="presence"><i>◉</i> Presence manager</button><button class="nav-item" data-page="assets"><i>▧</i> Assets</button><button class="nav-item" data-page="console"><i>⌘</i> Console</button><button class="nav-item" data-page="settings"><i>⚙</i> Settings</button></nav><div class="sidebar-foot"><div class="avatar">P</div><div class="userlabel"><strong>Personal workspace</strong><span>Local instance</span></div><span class="dots">•••</span></div></aside>
<main><header class="topbar"><div class="crumb">Workspace <span>/</span> <strong id="page-name">Overview</strong></div><div class="top-actions"><span class="connection"><i></i> Dashboard online</span><button class="icon-btn" aria-label="Notifications">♧</button><div class="avatar small">P</div></div></header><div class="content" id="view"></div></main>
<dialog id="editor"><form method="dialog" id="profile-form"><div class="modal-head"><div><span class="eyebrow">PROFILE EDITOR</span><h2 id="editor-title">New activity</h2></div><button class="icon-btn close">×</button></div><input type="hidden" name="id"><div class="form-grid"><label class="wide">Profile name<input name="name" required maxlength="60" placeholder="e.g. Late night gaming"></label><label>Activity type<select name="type"><option>Playing</option><option>Listening</option><option>Watching</option><option>Competing</option></select></label><label>Category<input name="category" maxlength="40" placeholder="Games"></label><label class="wide">Details<input name="details" maxlength="180" placeholder="What are you up to?"></label><label class="wide">State<input name="state" maxlength="180" placeholder="A little more context"></label><label>Large image URL<input name="largeImage" type="url" placeholder="https://..."></label><label>Large image hover text<input name="largeText" maxlength="180"></label><label>Small image URL<input name="smallImage" type="url" placeholder="https://..."></label><label>Small image hover text<input name="smallText" maxlength="180"></label><label>Party ID<input name="partyId" maxlength="100"></label><label>Party size / maximum<input name="partySize" type="number" min="0" placeholder="2 / 4"></label><label class="wide">Button 1 label and URL<div class="inline-fields"><input name="button1label" maxlength="32" placeholder="Open link"><input name="button1url" type="url" placeholder="https://..."></div></label><label class="wide">Button 2 label and URL<div class="inline-fields"><input name="button2label" maxlength="32" placeholder="Join us"><input name="button2url" type="url" placeholder="https://..."></div></label></div><div class="modal-actions"><button type="button" class="button secondary" id="duplicate">Duplicate</button><span class="spacer"></span><button type="button" class="button secondary close">Cancel</button><button class="button primary" value="save">Save profile</button></div></form></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
